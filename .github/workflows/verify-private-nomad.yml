name: Verify private Nomad deployment access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4

      - name: Install the deployment Nomad Pack version
        run: |
          set -euo pipefail
          archive="nomad-pack_0.3.0_linux_amd64.zip"
          install_root="$(mktemp -d)"
          trap 'rm -rf "$install_root"' EXIT
          curl -fsSL "https://releases.hashicorp.com/nomad-pack/0.3.0/$archive" -o "$install_root/$archive"
          printf '%s  %s\n' '0a4d83ce937e93c83248b9fbe7e80750767d26e57af07f59f24583426d531ea6' "$install_root/$archive" | sha256sum --check -
          unzip -q "$install_root/$archive" -d "$install_root"
          sudo install "$install_root/nomad-pack" /usr/local/bin/nomad-pack
      - name: Open private Nomad connection
        uses: run4w4y/infrastructure/.github/actions/nomad-access@e9528691fed6c36e5a3e4fb11621b32083ecbf38
        with:
          ssh-private-key: ${{ secrets.NOMAD_CI_SSH_KEY }}

      - name: Verify native ACL, TLS and restricted SSH access
        env:
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
          CLUSTER_PROBE_JOB: ente-web
        run: python3 "$CLUSTER_NOMAD_ACTION/verify.py"

      - name: Exercise the deployment CLI without registering a job
        env:
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: python3 "$CLUSTER_NOMAD_ACTION/probe-pack.py"

      - name: Close private Nomad connection
        if: always()
        run: |
          if [[ -n "${CLUSTER_NOMAD_ACTION:-}" ]]; then
            python3 "$CLUSTER_NOMAD_ACTION/close.py"
            test ! -e "$CLUSTER_NOMAD_CONTROL"
            test ! -e "$CLUSTER_NOMAD_DIRECTORY"
            echo "Private Nomad connection cleanup verified"
          fi
