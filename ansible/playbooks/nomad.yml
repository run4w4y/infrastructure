---
- name: install nomad server
  hosts: servers
  become: true
  become_user: root
  roles:
    - role: darkwizard242.cni
    - role: geerlingguy.docker
      tags:
        - docker
    - role: ansible-nomad
      tags:
        - docker
        - nomad
  pre_tasks:
    - name: Require the existing Infisical Nomad gossip key
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'NOMAD_GOSSIP_KEY') | length == 44
        fail_msg: Load NOMAD_GOSSIP_KEY from the infra project's /ansible folder before bootstrap.
      no_log: true
    - name: Check for configuration owned by the retired TLS migration
      ansible.builtin.stat:
        path: /etc/nomad.d/zz-cluster-security.json
      register: legacy_nomad_security

    - name: Require the security settings to use the normal Nomad configuration
      ansible.builtin.assert:
        that:
          - not legacy_nomad_security.stat.exists
        fail_msg: Consolidate and validate the existing TLS overlay before applying the normal Nomad role; its restart handlers must not perform this one-time adoption.
  vars:
    nomad_version: 1.10.0
    nomad_allow_purge_config: no
    nomad_leave_on_terminate: false
    nomad_encrypt_enable: true
    nomad_encrypt: "{{ lookup('ansible.builtin.env', 'NOMAD_GOSSIP_KEY') }}"
    nomad_datacenter: "dc1"
    nomad_domain: "consul"
    nomad_bind_address: "0.0.0.0"
    nomad_node_role: both
    nomad_use_consul: yes

    nomad_consul_address: "consul.service.dc1.consul:8501"
    nomad_consul_ssl: true
    nomad_consul_ca_file: /etc/consul/ssl/ca-consul.pem
    nomad_consul_cert_file: /etc/consul/ssl/cert-consul.pem
    nomad_consul_key_file: /etc/consul/ssl/cert-consul-key.pem
    nomad_verify_server_hostname: true

    nomad_acl_enabled: yes
    nomad_raft_protocol: 3

    # metrics collection
    nomad_telemetry: yes
    nomad_telemetry_publish_node_metrics: yes
    nomad_telemetry_publish_allocation_metrics: yes
    nomad_telemetry_prometheus_metrics: yes
    nomad_telemetry_disable_hostname: false

    # Vault integration
    nomad_vault_enabled: yes
    nomad_vault_address: https://vault.service.consul:8200
    nomad_vault_ca_file: /usr/local/share/ca-certificates/cluster-control.crt
    nomad_vault_tls_server_name: vault.service.consul
    nomad_vault_tls_skip_verify: false
    nomad_vault_create_from_role: "nomad-workloads"

    nomad_options: { 'driver.raw_exec.enable': '1' }
    nomad_network_speed: 0
    nomad_bootstrap_expect: 1
    nomad_docker_enable: yes
    permanent: yes
    nomad_ports_http: 4646
    nomad_ports_rpc: 4647
    nomad_ports_serf: 4648

    # consul-cni
    nomad_cni_enable: true
    nomad_cni_dir: /opt/cni/bin
    consul_cni_version: "1.7.0"
    consul_cni_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    # debug
    nomad_meta:
      connect:
        log_level: "debug"

    nomad_config_custom:
      leave_on_terminate: false
      tls:
        - http: true
          rpc: true
          ca_file: /usr/local/share/ca-certificates/cluster-control.crt
          cert_file: /etc/cluster-pki/nomad/current/cert.pem
          key_file: /etc/cluster-pki/nomad/current/key.pem
          verify_https_client: false
          verify_server_hostname: true
          tls_min_version: tls12

      server:
        - encrypt: "{{ nomad_encrypt }}"

      client:
        - cni_path: "{{ nomad_cni_dir | default('/opt/cni/bin') }}"

      consul:
        - grpc_address: consul.service.dc1.consul:8503 # use the tls grpc listener
          service_auth_method: "nomad-workloads"
          task_auth_method: "nomad-workloads"

          service_identity:
            - aud: ["consul.io"]
              ttl: 1h

          task_identity:
            - aud: ["consul.io"]
              ttl: 1h

      vault:
        - enabled: true
          address: https://vault.service.consul:8200
          ca_file: /usr/local/share/ca-certificates/cluster-control.crt
          tls_server_name: vault.service.consul
          tls_skip_verify: false
          jwt_auth_backend_path: "jwt-nomad"
          default_identity:
            - aud: ["vault.io"]
              ttl: 1h
              extra_claims:
                - unqiue_id: "${job.region}:${job.namespace}:${job.id}"

      plugin:
        - docker:
          - config:
            - volumes:
                - enabled: true
              extra_labels: ["job_name", "job_id", "task_group_name", "task_name", "namespace", "node_name", "node_id"]
              allow_privileged: true
              allow_caps:
                - "all"
              gc:
                - container: true
                  image: true
                  image_delay: "1h"

    nomad_zip_url: 'https://hashicorp-releases.yandexcloud.net/nomad/{{ nomad_version }}/nomad_{{ nomad_version }}_linux_{{ nomad_architecture }}.zip'
    nomad_checksum_file_url: 'https://hashicorp-releases.yandexcloud.net/nomad/{{ nomad_version }}/nomad_{{ nomad_version }}_SHA256SUMS'

  post_tasks:
    - name: download consul-cni plugin
      ansible.builtin.get_url:
        url: "https://hashicorp-releases.yandexcloud.net/consul-cni/{{ consul_cni_version }}/consul-cni_{{ consul_cni_version }}_linux_{{ consul_cni_arch }}.zip"
        dest: "/tmp/consul-cni_{{ consul_cni_version }}.zip"
        mode: "0644"
      register: consul_cni_zip

    - name: unarchive consul-cni
      ansible.builtin.unarchive:
        src: "{{ consul_cni_zip.dest }}"
        dest: "{{ nomad_cni_dir | default('/opt/cni/bin') }}"
        remote_src: yes
        creates: "{{ nomad_cni_dir | default('/opt/cni/bin') }}/consul-cni"
